<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#191724" />
    <title>New Tab</title>

    <style>
      :root {
        --rosewood: #191724;
        --text: #e0def4;
        --muted: #908caa;
        --love: #eb6f92;
        --iris: #c4a7e7;
        --foam: #9ccfd8;

        --wallpaper: url("assets/earrings.jpg");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        isolation: isolate;
        background: var(--rosewood);
        color: var(--text);
        font-family: "JetBrains Mono", "SFMono-Regular", Consolas,
          "Liberation Mono", monospace;
      }

      /* One image layer is blurred in place instead of creating a second image. */
      .wallpaper {
        position: fixed;
        z-index: -2;
        inset: -8px;
        background-color: var(--rosewood);
        background-image: var(--wallpaper);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        filter: blur(5px) saturate(0.85);
        transform: scale(1.03);
        pointer-events: none;
      }

      .veil {
        position: fixed;
        z-index: -1;
        inset: 0;
        background:
          linear-gradient(135deg, rgb(25 23 36 / 0.58), rgb(25 23 36 / 0.2)),
          linear-gradient(0deg, rgb(25 23 36 / 0.4), transparent 55%);
        pointer-events: none;
      }

      .clock {
        position: fixed;
        z-index: 1;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        text-align: center;
      }

      .clock__time {
        display: block;
        margin: 0;
        color: var(--text);
        font-size: clamp(4rem, 15vw, 12rem);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.08em;
        line-height: 0.95;
        text-shadow:
          0 0 1.5rem rgb(196 167 231 / 0.32),
          0 0 4rem rgb(235 111 146 / 0.18);
      }

      .clock__date {
        display: block;
        margin: 1.25rem 0 0;
        color: var(--foam);
        font-size: clamp(0.7rem, 1.5vw, 0.95rem);
        letter-spacing: 0.28em;
        line-height: 1.4;
        text-transform: uppercase;
      }

      @media (max-width: 30rem) {
        .wallpaper {
          filter: blur(3px) saturate(0.85);
        }

        .clock__time {
          letter-spacing: -0.1em;
        }

        .clock__date {
          letter-spacing: 0.16em;
        }
      }
    </style>
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="veil" aria-hidden="true"></div>

    <main class="clock" aria-label="Current time">
      <div>
        <time class="clock__time" data-clock aria-live="off">--:--:--</time>
        <time class="clock__date" data-date></time>
      </div>
    </main>

    <script src="clock.js"></script>
  </body>
</html>
